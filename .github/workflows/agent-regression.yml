name: Agent regression
on:
  pull_request:
    paths: ['functions/**', 'src/lib/**', 'src/kb/**', 'src/types.ts', 'scripts/**', 'package.json', 'bun.lock', '.github/workflows/agent-regression.yml']
  push:
    paths: ['functions/**', 'src/lib/**', 'src/kb/**', 'src/types.ts', 'scripts/**', 'package.json', 'bun.lock', '.github/workflows/agent-regression.yml']
permissions:
  contents: read
jobs:
  offline-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile
      - run: bun run test:agent
      - run: bunx tsc --noEmit -p scripts/tsconfig.chat.json
      - run: bunx tsc --noEmit -p scripts/tsconfig.claude-reeval.json
