# Cloudflare Pages project "moonsafe": static site (dist) + Pages Functions (functions/).
# Deploy: VITE_NETWORK=mainnet VITE_FACTORY_ADDRESS=<factory> bun run cf:deploy (pushing to GitHub does NOT deploy). moonsafe.app is MAINNET since 2026-10-29.
# Mirrors the project's dashboard settings; secrets (OPENAI_API_KEY) stay in Cloudflare.
name = "moonsafe"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# Per-user data (profile, chat), functions/api/userdata.ts.
# Mainnet KV "USERDATA_MAINNET" since 2026-10-29. Rollback to testnet: id f5f9fd482e3b4810898171fa71dca952.
[[kv_namespaces]]
binding = "USERDATA"
# id = the PRODUCTION (mainnet) users store, as bound in the Cloudflare dashboard on 2026-10-29; preview_id = the old testnet store.
id = "4dca45d1b7c14f3cb1250d78a266d936"
preview_id = "f5f9fd482e3b4810898171fa71dca952"

# AI-power ledger (today's messages, bought messages, credited payments), functions/_lib/ledger.ts. Since 2026-10-30.
# Schema: migrations/0001_ledger.sql (bunx wrangler d1 migrations apply moonsafe-ledger --remote).
[[d1_databases]]
binding = "DB"
database_name = "moonsafe-ledger"
database_id = "202c2a19-f817-49b5-9428-5bcc8d45c189"
migrations_dir = "migrations"
